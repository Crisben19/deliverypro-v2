<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeliveryPro | Repartidor</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/restaurante.css">
  <style>
    /* ESTILOS EXCLUSIVOS DEL REPARTIDOR */
    .status-toggle { display: flex; align-items: center; gap: 10px; background: white; padding: 10px 20px; border-radius: 50px; border: 1px solid #E2E8F0; margin-bottom: 20px; }
    .status-toggle span { font-weight: 600; color: #1E293B; }
    
    .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #CBD5E1; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #10B981; }
    input:checked + .slider:before { transform: translateX(22px); }

    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    
    .pedido-card-rep { background: white; border-radius: 16px; padding: 20px; border: 1px solid #E2E8F0; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .pedido-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
    .pedido-total-rep { font-size: 1.5rem; font-weight: 800; color: #FF5A5F; }
    .ruta-info { background: #F8FAFC; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; }
    .btn-rep { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-aceptar { background: #10B981; color: white; }
    .btn-aceptar:hover { background: #059669; }
    .btn-entregar { background: #3B82F6; color: white; }
    .btn-entregar:hover { background: #2563EB; }
  </style>
</head>
<body>

  <aside class="sidebar" style="background: linear-gradient(180deg, #1E293B 0%, #0F172A 100%);">
    <div class="brand"><span class="brand-icon" style="color: #1E293B;">D</span> DeliveryPro</div>
    
    <button class="menu-item active" onclick="cambiarSeccion('pedidos-disponibles', this)"><span>📦</span> Pedidos Disponibles</button>
    <button class="menu-item" onclick="cambiarSeccion('mis-entregas', this)"><span>🛵</span> Mis Entregas</button>
    
    <div class="profile-card" style="margin-top: auto;">
      <div class="profile-avatar" style="color: #1E293B;">P</div>
      <div class="profile-info">
        <div class="profile-name">Pedro Repartidor</div>
        <div class="profile-status" style="color: #CBD5E1;">Moto</div>
      </div>
      <button onclick="cerrarSesion(event)" style="background: rgba(255,255,255,0.2); border: none; color: white; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 1.1rem;">⏻</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="content">
      
      <!-- SECCIÓN 1: PEDIDOS DISPONIBLES -->
      <div id="pedidos-disponibles" class="tab-content active">
        <div class="header-title">
          <h1>Pedidos Disponibles</h1>
          <p>Toma un pedido y empieza a ganar dinero.</p>
        </div>

        <div class="status-toggle">
          <label class="switch">
            <input type="checkbox" id="toggle-disponible" checked onchange="alternarDisponibilidad(this)">
            <span class="slider"></span>
          </label>
          <span id="texto-disponibilidad">Estás en línea y disponible</span>
        </div>
        
        <div class="cards-grid" id="grid-disponibles">
          <p style="grid-column: 1/-1; text-align: center; color: #94A3B8;">Cargando pedidos...</p>
        </div>
      </div>

      <!-- SECCIÓN 2: MIS ENTREGAS -->
      <div id="mis-entregas" class="tab-content">
        <div class="header-title">
          <h1>Mis Entregas en Curso</h1>
          <p>Pedidos que has aceptado y están en camino.</p>
        </div>
        <div class="cards-grid" id="grid-mis-entregas">
          <p style="grid-column: 1/-1; text-align: center; color: #94A3B8;">No tienes entregas en curso.</p>
        </div>
      </div>

    </div>
  </main>

  <!-- MODAL DE NOTIFICACIÓN -->
  <div id="modal-notificacion" class="modal-overlay" style="display: none;">
    <div class="modal-box" style="text-align: center; padding: 40px;">
      <div id="noti-icono" style="font-size: 4rem; margin-bottom: 15px;">✅</div>
      <h2 id="noti-titulo" style="margin-bottom: 10px; color: #1E293B;">¡Listo!</h2>
      <p id="noti-mensaje" style="color: #64748B; margin-bottom: 25px;">La operación se realizó con éxito.</p>
      <button id="noti-boton" class="btn-primary" style="width: 100%; padding: 14px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer;" onclick="cerrarNotificacion()">Aceptar</button>
    </div>
  </div>

  <script src="js/repartidor.js"></script>
</body>
</html>
